<h1>Reposición de Stock</h1>

<form [formGroup]="form">

  <label for="ingrediente">Ingrediente</label>
  <select id="ingrediente" formControlName="ingrediente">
    <option value="">Seleccionar ingrediente</option>
  </select>

  <label for="cantidad">Cantidad ingresada</label>
  <input
    type="number"
    id="cantidad"
    formControlName="cantidad"
    placeholder="Ej: 20"
  >

  <label for="proveedor">Proveedor</label>
  <select id="proveedor" formControlName="proveedor">
    <option value="">Seleccionar proveedor</option>
  </select>

  <button type="submit">Cargar stock</button>

</form>
